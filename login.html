<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVR Properties | Admin Login</title>

  <!-- Global theme -->
  <link rel="stylesheet" href="style.css">

  <!-- Fonts: Poppins for UI, Playfair Display for wordmark/headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <header class="header" style="position:static;box-shadow:none;">
    <div class="logo">
      <img src="logo.svg" alt="MVR Properties" class="site-logo" style="height:34px;">
    </div>
  </header>

  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="container" style="width:100%;max-width:420px;">
      <div class="login-card" style="background:var(--surface);border-radius:12px;padding:24px;">
        <div style="text-align:center;margin-bottom:10px;">
          <img src="logo.svg" alt="MVR Properties" class="site-logo" style="height:34px;">
        </div>

        <h2 style="font-family:'Playfair Display',serif;color:var(--primary-gold);text-align:center;margin:8px 0;">Admin Login</h2>
        <p style="text-align:center;color:var(--muted);margin-bottom:16px;">Sign in to manage listings and publish properties</p>

        <!-- NOTE: IDs below are preserved exactly so existing login.js continues to work -->
        <form id="loginForm">
          <div class="form-group" style="margin-bottom:12px;">
            <label for="email" style="display:block;color:#fff;margin-bottom:6px;font-weight:600;">Email</label>
            <input type="email" id="email" placeholder="Enter Email" required class="input" />
          </div>

          <div class="form-group" style="margin-bottom:12px;">
            <label for="password" style="display:block;color:#fff;margin-bottom:6px;font-weight:600;">Password</label>
            <div class="password-box" style="position:relative;">
              <input type="password" id="password" placeholder="Enter Password" required class="input" />
              <span id="togglePassword" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;">👁️</span>
            </div>
          </div>

          <div class="options" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted);font-size:14px;">
            <label style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" id="rememberMe"> Remember Me
            </label>
            <a href="#" id="forgotPassword" style="color:var(--primary-gold);text-decoration:none;">Forgot Password?</a>
          </div>

          <button type="submit" class="btn primary" style="width:100%;">Login</button>
        </form>

        <div id="messageBox" class="message-box" style="margin-top:12px;display:none;"></div>

        <!-- preserve ID loadingOverlay used by login scripts -->
        <div id="loadingOverlay" class="loading-overlay" style="display:none;">
          <div class="loader" style="border:5px solid rgba(255,255,255,0.10);border-top:5px solid var(--primary-gold);width:44px;height:44px;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <p style="margin-top:10px;color:var(--muted);">Please wait...</p>
        </div>

      </div>
    </div>
  </main>

  <footer style="text-align:center;padding:14px;color:var(--muted);">© 2026 MVR Properties</footer>

  <!-- keep inline behavior scripts — these are unchanged in logic and IDs -->
  <script>
    const loginForm = document.getElementById("loginForm");
    if (loginForm) loginForm.addEventListener("submit", () => {
      const overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.style.display = "flex";
    });

    // toggle password — same behavior
    const password = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    if (toggle && password) toggle.onclick = () => {
      if (password.type === "password") {
        password.type = "text";
        toggle.innerHTML = "🙈";
      } else {
        password.type = "password";
        toggle.innerHTML = "👁️";
      }
    };

    // caps lock hint
    if (password) {
      const capsWarning = document.createElement("small");
      capsWarning.innerHTML = "⚠ Caps Lock is ON";
      capsWarning.style.display = "none";
      capsWarning.style.color = "#ffc7c7";
      capsWarning.style.fontWeight = "700";
      password.parentElement.appendChild(capsWarning);
      password.addEventListener("keyup", (e) => {
        capsWarning.style.display = e.getModifierState("CapsLock") ? "block" : "none";
      });
    }
  </script>

  <!-- existing login module remains (unchanged) -->
  <script type="module" src="login.js"></script>
</body>
</html>
